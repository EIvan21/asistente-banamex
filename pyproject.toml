    "langchain-anthropic>=1.7.13",
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.2.0",
    "lxml>=6.2.0",
    "openpyxl>=3.1.5",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn[standard]>=0.54.0",
]
[tool.uv]
package = false
